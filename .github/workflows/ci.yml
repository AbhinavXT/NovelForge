name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle.properties pins org.gradle.java.home to a JDK path on the
      # maintainer's machine; use the runner's JDK instead.
      - name: Use the runner's JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests include BundledPluginsTest (every bundled plugin loads
      # and matches its index entry) and the plugin runtime tests.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
